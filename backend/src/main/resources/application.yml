spring:
  application:
    name: soongpal

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/soongpal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-client-secret}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:Q0GxVWZGQ0jTPsEUzR8L+4HlJ57tbe7HjfUxaqzB1kgUrzzZn1SqIiHJEdEG6xgbkGSZ6zKYj4AxCWfWdoSE8A==}
  access-token-validity-in-milliseconds: ${JWT_ACCESS_VALIDITY:3600000}         # 1시간
  refresh-token-validity-in-milliseconds: ${JWT_REFRESH_VALIDITY:1209600000}    # 14일
  temp-token-validity-in-milliseconds: ${JWT_TEMP_VALIDITY:600000}             # 10분

# ===== 카카오 연결끊기(회원탈퇴)용 어드민 키 =====
kakao-admin:
  key: ${KAKAO_ADMIN_KEY:dummy-admin-key}

# ===== 앱 자체 설정 =====
app:
  oauth2:
    authorized-redirect-uri: ${APP_REDIRECT_URI:http://localhost:3000}
  cookie:
    domain: ${APP_COOKIE_DOMAIN:localhost}
    secure: ${APP_COOKIE_SECURE:false}
  # 로컬 개발 단계에서 끄고 싶은 외부 연동 기능 스위치
  feature:
    firebase:
      enabled: ${FEATURE_FIREBASE_ENABLED:false}
    s3:
      enabled: ${FEATURE_S3_ENABLED:false}

# ===== Firebase (feature.firebase.enabled=true일 때만 사용됨) =====
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:firebase/firebase-adminsdk.json}

# ===== AWS S3 (feature.s3.enabled=true일 때만 사용됨) =====
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:dummy}
      secret-key: ${AWS_SECRET_KEY:dummy}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:dummy-bucket}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
